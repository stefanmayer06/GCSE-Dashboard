services:
  gcse-dashboard:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    container_name: gcse-dashboard
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      STORAGE_DRIVER: ${STORAGE_DRIVER:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_CONTAINER_URL:-${SUPABASE_URL:-}}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_OAUTH_PROVIDER: ${SUPABASE_OAUTH_PROVIDER:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_AUTHORIZE_URL: ${OAUTH_AUTHORIZE_URL:-}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-}
      OAUTH_USERINFO_URL: ${OAUTH_USERINFO_URL:-}
      OAUTH_SCOPE: ${OAUTH_SCOPE:-openid profile email}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-OAuth}
    volumes:
      - gcse-data:/app/data
    restart: unless-stopped

volumes:
  gcse-data:
