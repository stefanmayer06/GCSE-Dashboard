<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#191b30" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Sign in to MathsMate for AQA GCSE Maths Foundation and Higher revision, exam practice, worked solutions and progress tracking." />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23191b30'/><g transform='translate(16 16)' stroke='%23191b30' stroke-width='1.3' stroke-linejoin='round'><path d='M0 0V-10A10 10 0 0 1 10 0Z' fill='%233d6bff'/><path d='M0 0H10A10 10 0 0 1 0 10Z' fill='%2310b5c9'/><path d='M0 0V10A10 10 0 0 1 -10 0Z' fill='%233d6bff'/><path d='M0 0H-10A10 10 0 0 1 0 -10Z' fill='%23c3f53c'/></g></svg>" />
    <script>
      try {
        document.documentElement.setAttribute('data-subject', window.location.pathname.indexOf('/maths-higher') === 0 ? 'maths-higher' : 'maths');
        var t = localStorage.getItem('gcse-theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
